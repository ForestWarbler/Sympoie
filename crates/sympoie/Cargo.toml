[package]
name = "sympoie"
description = "Audio engine, project model and file formats of the Sympoie workstation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native-pitch"]
native-pitch = ["dep:sympoie-signalsmith-pitch", "dep:sympoie-rubberband-pitch"]

[dependencies]
sympoie-signalsmith-pitch = { path = "../../vendor/signalsmith-pitch", optional = true }
sympoie-rubberband-pitch = { path = "../../vendor/rubberband-pitch", optional = true }
flacenc = { version = "0.5.1", default-features = false }
mp3lame-encoder = "0.2.5"

[dev-dependencies]
# Already built for flacenc; the tests use it to check FLAC checksums.
md-5 = "0.10.6"

[lints]
workspace = true
